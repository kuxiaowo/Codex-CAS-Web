{% extends "base.html" %}
{% block title %}账户 · {{ site.siteName }}{% endblock %}

{% block content %}
<div class="auth-shell">
  <section class="auth-intro">
    <p class="eyebrow">ACCOUNT</p>
    <h1>回来继续整理<br>你的知识坐标。</h1>
    <p>账号用于参与图集讨论；管理员可进入内容后台。</p>
    <div class="auth-decoration" aria-hidden="true"><span></span><span></span><span></span></div>
  </section>

  <section class="auth-panel nethub-auth-panel">
    <p class="eyebrow">NETHUB ACCOUNT</p>
    <h2>注册或登录</h2>
    <p class="nethub-auth-note">本网站使用 NetHub 账号登录，请前往账号管理界面</p>
    <a class="button button-primary button-wide" href="/auth/login?next={{ next }}" target="_blank" rel="noopener noreferrer">登录或注册 NetHub 账号后继续</a>
  </section>
</div>
{% endblock %}
