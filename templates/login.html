{% extends "base.html" %}
{% block title %}账户 · {{ site.siteName }}{% endblock %}

{% block content %}
<div class="auth-shell">
  <section class="auth-intro">
    <p class="eyebrow">ACCOUNT</p>
    <h1>回来继续整理<br>你的知识坐标。</h1>
    <p>账号用于参与图集讨论；管理员可进入内容后台。</p>
    <div class="auth-decoration" aria-hidden="true"><span></span><span></span><span></span></div>
  </section>

  <section class="auth-panel">
    <div class="auth-tabs" role="tablist">
      <button class="is-active" type="button" role="tab" data-auth-tab="login">登录</button>
      {% if registrationEnabled %}<button type="button" role="tab" data-auth-tab="register">注册</button>{% endif %}
    </div>
    <form class="auth-form" data-auth-form="login">
      <label>用户名<input name="username" autocomplete="username" minlength="2" maxlength="50" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <p class="form-error" data-form-error></p>
      <button class="button button-primary button-wide" type="submit">登录账户</button>
    </form>
    {% if registrationEnabled %}
    <form class="auth-form is-hidden" data-auth-form="register">
      <label>用户名<input name="username" autocomplete="username" minlength="2" maxlength="50" required></label>
      <label>显示名称<input name="displayName" autocomplete="name" minlength="1" maxlength="50" required></label>
      <label>密码<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>确认密码<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="form-error" data-form-error></p>
      <button class="button button-primary button-wide" type="submit">创建账户</button>
    </form>
    {% endif %}
  </section>
</div>
{% endblock %}
