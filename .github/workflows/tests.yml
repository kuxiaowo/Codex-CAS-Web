name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bash -n scripts/init_linux.sh
      - name: Validate generated systemd unit
        run: |
          python scripts/render_systemd_unit.py \
            --app-dir "$PWD" \
            --env-file "$PWD/.env.example" \
            --python-bin "$(command -v python)" \
            --output /tmp/codex-cas-web.service
          systemd-analyze verify /tmp/codex-cas-web.service
